amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: False
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0 #3.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 3000 #2000
    min_particles: 500
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: True
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: ldlidar_node/scan
    set_initial_pose: True
    initial_pose: 
      x: 1.3905823230743408
      y: 1.3905823230743408
      yaw: -1.5707963267948966

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 100 #20
    wait_for_service_timeout: 5000 #1000
    action_server_result_timeout: 4500.0 #900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    default_nav_to_pose_bt_xml: ""  # set at launch time by navigation_launch.py
    # default_nav_through_poses_bt_xml: /home/searchforce/workspace/ros2_ws/src/searchforce/config/navigate_through_poses_w_replanning_and_recovery.xml # or $(find-pkg-share my_package)/behavior_tree/my_nav_through_poses_bt.xml
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.

    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

    error_code_name_prefixes:
      - compute_path
      - follow_path
      - nav_to_pose

controller_server:
  ros__parameters:
    controller_frequency: 20.0 #20.0 10.0
    costmap_update_timeout: 3.00 #0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    transform_tolerance: 10.0 #0.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    use_realtime_priority: False
    use_sim_time: False

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05 #0.5 0.05
      movement_time_allowance: 10.0 #10.0
    # Goal checker parameters
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15 #0.15
      yaw_goal_tolerance: 3.4 #0.25
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.1 #0.5 0.075
      lookahead_dist: 0.15 #0.6
      min_lookahead_dist: 0.15 #0.3
      max_lookahead_dist: 0.3 #0.9
      lookahead_time: 0.05 #0.5
      rotate_to_heading_angular_vel: 1.3 #1.8
      transform_tolerance: 10.0 #0.1
      use_velocity_scaled_lookahead_dist: false #false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.2 #0.6
      use_collision_detection: false #true
      max_allowed_time_to_collision_up_to_carrot: 0.3 #1.0
      use_regulated_linear_velocity_scaling: true
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.15 #0.25
      use_cost_regulated_linear_velocity_scaling: false #false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      allow_reversing: true #false
      rotate_to_heading_min_angle: 0.785
      max_angular_accel: 1.3 #3.2 1.0
      max_robot_pose_search_dist: 10.0
      stateful: true
    # # DWB parameters
