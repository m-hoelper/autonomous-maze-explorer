local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      use_sim_time: False
      rolling_window: True
      width: 1
      height: 1
      resolution: 0.01
      track_unknown_space: False #True
      lethal_cost_threshold: 253 #100
      transform_tolerance: 10.0 #0.3
      # Robot footprint as rectangle
      # footprint: "[[-0.155, -0.135], [-0.155, 0.135], [0.155, 0.135], [0.155, -0.135]]" # 0.05
      footprint: "[[-0.01, -0.01], [-0.01, 0.01], [0.01, 0.01], [0.01, -0.01]]" # 0.05
      footprint_padding: 0.07 # 0.07 Optional safety buffer
      # robot_radius: 0.05  # Must be 0 if using custom footprint
      plugins: ["inflation_layer","obstacle_layer","static_layer"] #obstacle_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: False
        observation_sources: scan
        scan:
          topic: /ldlidar_node/scan
          max_obstacle_height: 0.3
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 1.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        footprint_clearing_enabled: False #False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 30.0 #10.0 15.0
        inflation_radius: 0.3 #0.3 0.13
      always_send_full_costmap: True # True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      use_sim_time: False
      # # Robot footprint as rectangle
      # footprint: "[[-0.155, -0.135], [-0.155, 0.135], [0.155, 0.135], [0.155, -0.135]]" # 0.05
      footprint: "[[-0.01, -0.01], [-0.01, 0.01], [0.01, 0.01], [0.01, -0.01]]" # 0.05
      footprint_padding: 0.05 # 0.07 Optional safety buffer
      # robot_radius: 0.07  # Must be 0 if using custom footprint
      resolution: 0.02
      track_unknown_space: False #True
      lethal_cost_threshold: 253 #100
      transform_tolerance: 10.0 #0.3
      plugins: ["static_layer","obstacle_layer","inflation_layer"] #obstacle_layer
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: False
        observation_sources: scan
        scan:
          topic: /ldlidar_node/scan
          max_obstacle_height: 0.3
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 1.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        footprint_clearing_enabled: False #False
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 30.0 # 10.0 15.0
        inflation_radius: 0.3 #0.3 0.13
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: ""

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

